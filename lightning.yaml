# lightning.yaml

app_name: lucen-ai
description: Sentiment analysis platform for crypto tweets using DistilBERT (LucenAI)

components:
  backend:
    type: serve
    source: scripts/serve_api.py
    name: api
    port: 8000

  frontend:
    type: web_static
    source: lucenai/frontend
    name: ui
    port: 80